# =============================================================================
# 对接优先级建议 (Priority Roadmap)
# =============================================================================
roadmap:
  phase_1_immediate:
    description: 立即对接 — 数据量大、免费或易获取
    sites:
      - cebpubservice    # 中国招标投标公共服务平台（法定公告源）
      - ccgp             # 中国政府采购网（全国免费）
      - trade365         # 中招联合SaaS（多个央企汇集）
      - e-bidding        # 国信e采SaaS（多个央企汇集）
      - youzhicai        # 优质采SaaS（多个央企汇集）

  phase_2_short_term:
    description: 短期对接 — 关键省市和大央企
    sites:
      - beijing-ggzy, shanghai-ggzy, guangdong-ggzy, shenzhen-ggzy
      - jiangsu-ggzy, zhejiang-ggzy, shandong-ggzy, hubei-ggzy
      - cnpc-bidding, sinopec-ebidding, cnooc-buy
      - cscec-yzw, crec-gec, crcc-ecp
      - china-railway-95306, ciesco-dzzb, crc-szecp
      - qianlima, bidcenter

  phase_3_medium_term:
    description: 中期对接 — 其他省份和国企
    sites:
      - 其余26个省级公共资源交易平台
      - 重点城市（广州、成都、武汉、杭州、南京等）
      - 其他央企集团平台（大唐、华电、国家电投、中广核等）
      - 其他专业平台（okcis、zhaobiao、jianyu360等）

  phase_4_long_term:
    description: 长期对接 — 补充覆盖
    sites:
      - 各地级市公共资源交易平台
      - 其他国企集团平台
      - 军队采购网（需评估可行性）


# =============================================================================
# 技术对接策略
# =============================================================================
technical_strategy:
  gov_platforms:
    description: 政府公共资源交易平台
    common_patterns:
      - 多数采用江苏国泰新点/北京筑龙/广联达等第三方系统
      - 列表页通常无需登录即可浏览标题和摘要
      - 详情页可能需要CA证书登录
      - 有WAF反爬（Cloudflare/阿里云WAF）
    approach:
      - 优先尝试API接口（部分平台有开放API）
      - 使用Scrapling/Playwright浏览器渲染
      - 列表页抓取标题+链接即可，详情可选
      - 可考虑RSS订阅（部分平台提供）

  soe_platforms:
    description: 央企集团采购平台
    common_patterns:
      - 大量使用第三方SaaS：国信e采、中招联合、优质采
      - 统一对接SaaS平台可获得多家央企标讯
      - 多数需要供应商注册登录
    approach:
      - 优先对接三个SaaS平台（trade365/e-bidding/youzhicai）
      - 注册供应商账号获取查看权限
      - 直接API调用优于浏览器渲染

  commercial_platforms:
    description: 商业标讯聚合平台
    common_patterns:
      - 数据量大、质量高、覆盖全面
      - 核心数据需付费VIP
      - 部分有付费API接口
    approach:
      - 评估付费API性价比
      - 可先使用免费层级获取列表
      - 与手动监控配合使用
